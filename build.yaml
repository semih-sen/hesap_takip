# build_runner configuration.
#
# The code generators are active via dev_dependencies:
#   - drift_dev            (Drift database / DAO codegen)
#   - riverpod_generator   (Riverpod v3 provider codegen)
#   - freezed              (immutable model codegen)
#   - json_serializable    (JSON mappers)
#
targets:
  $default:
    builders:
      drift_dev:
        options:
          # Store DateTime columns as ISO-8601 text rather than unix-epoch
          # integers. Avoids the legacy epoch/UTC ambiguity for the audit
          # timestamp columns (createdAt/updatedAt) and keeps date-only columns
          # sortable as strings (PROJECT_PLAN §7, Phase 1 task 4).
          store_date_time_values_as_text: true
      # Keep generated aggregate files free of analyzer noise.
      source_gen:combining_builder:
        options:
          ignore_for_file:
            - type=lint
